<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// GoatCounter: path cleaner, live-host gate, no auto pageview. count.js onload sends one view.
(function(){
  function goatPath(p){
  p=String(p==null?'':p);
  var hash='',h=p.indexOf('#');
  if(h>=0){hash=p.slice(h);p=p.slice(0,h)}
  var q=p.indexOf('?');
  if(q<0)return p+hash;
  var path=p.slice(0,q),kept=[],parts=p.slice(q+1).split('&');
  for(var i=0;i<parts.length;i++){
    var pair=parts[i];if(!pair)continue;
    var key=pair.split('=')[0],dec=key;
    try{dec=decodeURIComponent(key.replace(/\+/g,' '))}catch(e){}
    dec=String(dec).toLowerCase();
    if(dec==='twclid'||dec==='fbclid'||dec==='gclid')continue;
    kept.push(pair);
  }
  return path+(kept.length?'?'+kept.join('&'):'')+hash;
}
  function gcLiveHost(host){
  host=String(host||'').toLowerCase();
  return host==='optrack.app'||host==='www.optrack.app';
}
  function gcTestFlag(search, store){
  return /(?:^|[?&])gc_test=1(?:&|$)/.test(String(search||''))||store==='1';
}
  function gcShouldCount(host, search, store){
  return gcLiveHost(host)||gcTestFlag(search, store);
}
  function gcTakePageview(state){
  if(!state)state={};
  if(state.sent)return false;
  state.sent=true;
  return true;
}
  window.gcShouldCount=gcShouldCount;
  window.goatcounter=window.goatcounter||{};
  window.goatcounter.path=function(p){return goatPath(p)};
  window.goatcounter.no_onload=true;
  window._gcPv={sent:false};
  window._gcSendPageview=function(){
    if(window._gcSkip){window._gcPv.sent=true;return;}
    if(!gcShouldCount(location.hostname,location.search,window._gcStoreTest))return;
    var gc=window.goatcounter;
    if(!gc||typeof gc.count!=='function')return;
    var fire=function(){
      if(!gcTakePageview(window._gcPv))return;
      gc.count();
    };
    var ready=function(fn){
      if(navigator&&typeof navigator.sendBeacon==='function'){fn();return;}
      if(document.body){fn();return;}
      document.addEventListener('DOMContentLoaded',fn,false);
    };
    if(!('visibilityState' in document)||document.visibilityState==='visible')
      ready(fire);
    else{
      var f=function(){
        if(document.visibilityState!=='visible')return;
        document.removeEventListener('visibilitychange',f);
        ready(fire);
      };
      document.addEventListener('visibilitychange',f);
    }
  };
})();
</script>
<script>try{if(localStorage.getItem('ot-sim')==='1')window._gcSkip=1;window._gcStoreTest=localStorage.getItem('gc_test');}catch(e){}if(window._gcSendPageview)window._gcSendPageview();</script>
<script data-goatcounter="https://optrack.goatcounter.com/count" async src="https://gc.zgo.at/count.js" onload="window._gcSendPageview&&window._gcSendPageview()"></script>
<title>Page not found · OpTrack</title>
<meta name="robots" content="noindex">

<style>
@font-face{font-family:'Urbanist';font-style:normal;font-weight:100 900;font-display:swap;src:url('/urbanist-var.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:900;font-display:swap;src:url('/nunito-900.woff2') format('woff2')}
:root{--bg:#f8f9fc;--card:#fff;--text:#110f15;--text2:#545a56;--text3:#5b5d62;--line:#e4e6eb;--brand-orange:#FF5A36;--brand-orange-hover:#e84a28;--accent:var(--brand-orange);--shadow:0 2px 4px rgba(17,15,21,.05),0 8px 16px rgba(17,15,21,.06)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.25rem;background:var(--bg);color:var(--text);font:16px/1.6 Urbanist,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;margin-bottom:1.5rem}
.logo img{width:47px;height:47px;display:block}
.wm{font-family:Nunito,sans-serif;font-weight:900;font-size:2.0625rem;line-height:1;display:inline-block;color:var(--text);transform:skewX(-9deg);transform-origin:center bottom}
.card{width:100%;max-width:28rem;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:1.75rem 1.75rem 1.5rem}
h1{font-size:1.5rem;font-weight:600;line-height:1.2;margin:0 0 .5rem}
p{color:var(--text2);margin:0 0 1.25rem}
.acts{display:flex;gap:.625rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.625rem 1.125rem;border-radius:6px;text-decoration:none;font-weight:600;font-size:.95rem}
.btn.p{background:var(--accent);color:#fff}.btn.p:hover{background:var(--brand-orange-hover)}
.btn.g{border:1px solid var(--line);color:var(--text);background:var(--card)}
.small{margin-top:1.25rem;font-size:.85rem;color:var(--text3)}
.small a{color:var(--accent)}
</style>
</head>
<body>
<a class="logo" href="/"><img src="/logo-mark.svg?v=372" alt="" width="47" height="47"><span class="wm">OpTrack</span></a>
<div class="card">
  <h1>Page not found</h1>
  <p>That link doesn't go anywhere. It may have moved, or there may be a typo in the address.</p>
  <div class="acts"><a class="btn p" href="/app/">Open OpTrack</a><a class="btn g" href="/demo">Try the demo</a></div>
  <div class="small">Or go back to the <a href="/">home page</a>.</div>
</div>
</body>
</html>
